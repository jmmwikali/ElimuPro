<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111F" />
    <meta name="description" content="ElimuNova is an integrated education platform connecting students, schools, parents and teachers. Reimagining Education. Empowering Every Future." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ElimuNova" />
    <meta property="og:title" content="ElimuNova" />
    <meta property="og:description" content="Reimagining Education. Empowering Every Future." />
    <!-- og:image / og:url need absolute URLs. Build with PUBLIC_URL=https://<confirmed-domain> and add og:url then. -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ElimuNova" />
    <meta name="twitter:description" content="Reimagining Education. Empowering Every Future." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet" />
    <title>ElimuNova</title>
  </head>

    <div id="root"></div>
  </body>
</html>
