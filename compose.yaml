services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elimupro}
      POSTGRES_USER: ${POSTGRES_USER:-elimupro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: ["flask", "--app", "run:app", "db", "upgrade"]
    environment: &backend-environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-elimupro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-elimupro}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      JWT_ACCESS_HOURS: ${JWT_ACCESS_HOURS:-12}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CYZORA_SECRET_KEY: ${CYZORA_SECRET_KEY:-}
      CYZORA_WEBHOOK_SECRET: ${CYZORA_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
